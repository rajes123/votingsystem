name: Deploy code to aws
on:
  push:
    branches:
      -  master
  pull_request:
    branches:
      -  master

jobs:
   CodeQLCan:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write    # required to upload results to the Security tab
      contents: read            # required to read the repo code
      actions: read             # required for private repos
      packages: read            # required to fetch CodeQL packs
 
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
 
    steps:
      # Step 1: download the repo code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4
 
      # Step 2: initialize CodeQL and build its database of your code
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          
      # Step 4: run the queries against the database and upload results
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"   # separates results per language

   SecuretyScan:
    runs-on: ubuntu-latest
    needs: CodeQLCan
    steps:
    - uses: actions/checkout@v4 
    - name: Install trivy
      run: |
        sudo apt-get install wget gnupg
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update -y
        sudo apt-get install trivy -y

    - name: Scan code using trivy
      run: trivy fs --format table -o fs-reports.json .

    - name: install gitlakes
      run: sudo apt install gitleaks

    - name: Gitlakes code scan
      run: gitleaks detect --source . --report-path gitleaks-report.json
      
   dockerbuildandpush:
    runs-on: ubuntu-latest
    needs: SecuretyScan
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: app:latest
         
    
