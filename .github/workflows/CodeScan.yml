name: Deploy code to aws

on:
  push:
    branches:
      -  master
  pull_request:
    branches:
      -  master

jobs:
   analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
 
    # STEP 2: Permissions - least privilege
    permissions:
      security-events: write    # required to upload results to the Security tab
      contents: read            # required to read the repo code
      actions: read             # required for private repos
      packages: read            # required to fetch CodeQL packs
 
    # STEP 3: Languages to scan - add more entries to scan multiple languages
    #   javascript-typescript | python | java-kotlin | go | csharp | ruby | cpp | swift
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
 
    steps:
      # Step 1: download the repo code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4
 
      # Step 2: initialize CodeQL and build its database of your code
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Query suites (pick one):
          #   default            - high-confidence security queries
          #   security-extended  - more security queries, slightly more noise
          #   security-and-quality - security + code quality queries
          queries: security-extended
 
      # Step 3: build step - NOT needed for JavaScript/TypeScript/Python/Ruby.
      # Needed only for compiled languages (Java, C#, Go, C++, Swift).
      # - name: Autobuild
      #   uses: github/codeql-action/autobuild@v3
 
      # Step 4: run the queries against the database and upload results
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"   # separates results per language
